# uhlaka with its database and Valkey (ADR 0048). install.sh --host=docker writes
# .env beside it with the answers; COMPOSE_PROFILES there starts the database
# chosen (postgres, mysql or mariadb) and Valkey. With SQLite, the site is a file
# in the volume "site", and no database runs.
#
#   docker compose up -d --build
#   docker compose logs uhlaka        the link for the first page
#
# Every service listens only inside this compose, and the site on this machine
# (127.0.0.1): a web server with the certificate (Caddy, nginx) is put in front.
services:
  uhlaka:
    build:
      context: .
      args:
        VERSION: ${UHLAKA_VERSION:-latest}
    image: uhlaka:${UHLAKA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${UHLAKA_PORT:-4321}:4321
    environment:
      UHLAKA_SITE: ${UHLAKA_SITE:-/site/site.db}
      UHLAKA_PUBLIC: ${UHLAKA_PUBLIC:-http://localhost:4321}
      UHLAKA_VALKEY_URL: ${UHLAKA_VALKEY_URL:-}
    volumes:
      - site:/site

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: uhlaka
      POSTGRES_USER: uhlaka
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uhlaka
      MYSQL_USER: uhlaka
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql:/var/lib/mysql

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: uhlaka
      MARIADB_USER: uhlaka
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mariadb:/var/lib/mysql

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [valkey]
    restart: unless-stopped
    volumes:
      - valkey:/data

volumes:
  site:
  postgres:
  mysql:
  mariadb:
  valkey:
