# thecms with its database and Valkey (ADR 0048). install.sh --host=docker writes
# .env beside it with the answers; COMPOSE_PROFILES there starts the database
# chosen (postgres, mysql or mariadb) and Valkey. With SQLite, the site is a file
# in the volume "site", and no database runs.
#
#   docker compose up -d --build
#   docker compose logs thecms        the link for the first page
#
# Every service listens only inside this compose, and the site on this machine
# (127.0.0.1): a web server with the certificate (Caddy, nginx) is put in front.
services:
  thecms:
    build:
      context: .
      args:
        VERSION: ${THECMS_VERSION:-latest}
    image: thecms:${THECMS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${THECMS_PORT:-4321}:4321
    environment:
      THECMS_SITE: ${THECMS_SITE:-/site/site.db}
      THECMS_PUBLIC: ${THECMS_PUBLIC:-http://localhost:4321}
      THECMS_VALKEY_URL: ${THECMS_VALKEY_URL:-}
    volumes:
      - site:/site

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: thecms
      POSTGRES_USER: thecms
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: thecms
      MYSQL_USER: thecms
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql:/var/lib/mysql

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: thecms
      MARIADB_USER: thecms
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?run install.sh --host=docker, or set DATABASE_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mariadb:/var/lib/mysql

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [valkey]
    restart: unless-stopped
    volumes:
      - valkey:/data

volumes:
  site:
  postgres:
  mysql:
  mariadb:
  valkey:
