name: Image

# The image Railway, Render and Fly.io run (ADR 0048): docker/Dockerfile with the
# program of a published release, for x64 and arm64, at ghcr.io/<repository>,
# tagged with the version and latest (pre-releases too, as install.sh does).
# The release workflow calls it; run by hand, it makes the image of a release
# already published.
#
# The program comes from the release's own files, downloaded here with the
# workflow's token, and is checked by install.sh against the release's checksums
# inside the build: the repository may be private, and then its releases cannot
# be downloaded without one.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release's tag, like v0.1.0-alpha.2
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release's files, beside the Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          gh release download "$TAG" --dir docker --clobber --pattern 'thecms-linux-*' --pattern checksums.sha256 --pattern install.sh
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
            RELEASE_URL=file:///release
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
