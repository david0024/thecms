name: Release

# A tag v<version> publishes a release: the program as one file for each
# platform, the checksums, and the install scripts (tools/build.ts, install.sh,
# install.ps1, and for Docker, docker/). The tag must be the version in package.json.
# Then the image the ready platforms run (ADR 0048), at ghcr.io/<repository>:<version>.
#
# Run by hand ("Run workflow"), it makes that tag itself on the commit it runs
# on, from the version in package.json, and publishes the same way.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: The tag is the version
        id: tag
        run: |
          tag="v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - run: bun run check
      - run: bun tools/build.ts dist-bin
      # What people will download, run once before it is published: installed from these files, a site made and exported.
      - name: Try the Linux build
        run: |
          RELEASE_URL="file://$PWD/dist-bin" INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          cd "$RUNNER_TEMP"
          bin/thecms init site.db
          bin/thecms export site.db out
          grep -q '<h1>Solid wood furniture, made to measure</h1>' out/index.html
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          cp install.sh install.ps1 docker/Dockerfile docker/compose.yaml dist-bin/
          # What install.sh fetches beside the program for Docker (ADR 0048) is checked the same way.
          (cd dist-bin && sha256sum Dockerfile compose.yaml install.sh >>checksums.sha256)
          # A version with a dash (0.1.0-alpha.1, 0.2.0-beta.3) is a pre-release (ADR 0045).
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # Run by hand, the tag is made here, on this commit; a version already released is refused.
          gh release create "$TAG" dist-bin/* --title "$TAG" --generate-notes --target "$GITHUB_SHA" $pre

  # The image Railway, Render and Fly.io run (ADR 0048), made from the files just published.
  image:
    needs: release
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
