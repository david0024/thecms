name: Release

# A tag v<version> publishes a release: the program as one file for each
# platform, the checksums, and the install scripts (tools/build.ts, install.sh,
# install.ps1). The tag must be the version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: The tag is the version
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
      - run: bun run check
      - run: bun tools/build.ts dist-bin
      # What people will download, run once before it is published: installed from these files, a site made and exported.
      - name: Try the Linux build
        run: |
          RELEASE_URL="file://$PWD/dist-bin" INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          cd "$RUNNER_TEMP"
          bin/thecms init site.db
          bin/thecms export site.db out
          grep -q '<h1>Solid wood furniture, made to measure</h1>' out/index.html
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh install.ps1 dist-bin/
          gh release create "$GITHUB_REF_NAME" dist-bin/* --title "$GITHUB_REF_NAME" --generate-notes
